name: Stop and Resize Azure VM

on:
  workflow_dispatch:

jobs:
  resize:
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: "rg-vm"
      VM_NAME:        "vm1"
      NEW_SIZE:       "Standard_D2s_v3"

    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: VM band karo (deallocate)
        run: |
          STATUS=$(az vm get-instance-view \
            --resource-group $RESOURCE_GROUP \
            --name $VM_NAME \
            --query "instanceView.statuses[1].code" -o tsv)
          echo "Current status: $STATUS"
          if [[ "$STATUS" != *"deallocated"* ]]; then
            echo "VM band ho rahi hai..."
            az vm deallocate \
              --resource-group $RESOURCE_GROUP \
              --name $VM_NAME
            echo "VM band ho gayi!"
          else
            echo "VM already band hai"
          fi

      - name: VM size change karo
        run: |
          echo "Size change ho rahi hai..."
          az vm resize \
            --resource-group $RESOURCE_GROUP \
            --name $VM_NAME \
            --size $NEW_SIZE
          echo "Size change ho gayi!"

      - name: VM start karo
        if: always()
        run: |
          az vm start \
            --resource-group $RESOURCE_GROUP \
            --name $VM_NAME
          echo "VM chal padi!"

      - name: Size verify karo
        run: |
          CURRENT_SIZE=$(az vm show \
            --resource-group $RESOURCE_GROUP \
            --name $VM_NAME \
            --query "hardwareProfile.vmSize" -o tsv)
          echo "VM ka naya size: $CURRENT_SIZE"